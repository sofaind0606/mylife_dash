<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeDashboard | Трекер привычек</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --color-primary: #93ABDB;
            --color-primary-dark: #768FC2;
            --color-primary-light: #C2D4F5;
            --color-secondary: #FAF4CD;
            --color-secondary-dark: #E6DFB3;
            --color-secondary-light: #FFF9E6;
            --color-accent: #5B6F9E;
            --color-text: #3D4A66;
            --color-text-light: #6B7C9E;
            --color-text-muted: #A5B3CC;
            --color-nav: #93ABDB;
            --color-nav-light: #A6BCE8;
            --color-border: #FAF4CD;
            --color-border-light: #FFF4E0;
            --color-bg: #FDFBF0;
            --color-bg-alt: #FFFFFF;
            --color-success: #6BCB77;
            --color-warning: #FFD93D;
            --color-danger: #E15554;
            --shadow-sm: 0 2px 8px rgba(91, 111, 158, 0.05);
            --shadow-md: 0 4px 15px rgba(91, 111, 158, 0.08);
            --shadow-lg: 0 10px 30px rgba(91, 111, 158, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--color-bg); min-height: 100vh; color: var(--color-text); line-height: 1.5; }

        .app-layout { display: flex; min-height: 100vh; position: relative; overflow-x: hidden; }
        .burger-btn { display: none; position: fixed; top: 16px; left: 16px; z-index: 1003; width: 44px; height: 44px; background: var(--color-primary); border: none; border-radius: 50%; color: white; font-size: 1.6rem; cursor: pointer; box-shadow: var(--shadow-md); align-items: center; justify-content: center; }
        .nav-frame {
            width: 18%; min-width: 220px; background: var(--color-primary); padding: 24px 16px; border-right: 2px solid var(--color-primary-dark);
            position: fixed; height: 100vh; overflow-y: auto; z-index: 100; box-shadow: 4px 0 20px rgba(62, 92, 102, 0.15);
            transition: transform 0.3s ease;
        }
        .logo { margin-bottom: 16px; padding: 12px; border-bottom: 2px solid #ffffff; text-align: center; background: rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .logo h1 { color: #ffffff; font-size: 1.2rem; font-weight: 700; }
        .logo p { color: var(--color-bg); font-size: 0.75rem; opacity: 0.9; }
        .nav-section { margin-bottom: 20px; }
        .nav-title { color: rgba(255,255,255,0.7); font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; padding-left: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: whitesmoke; text-decoration: none; border-radius: var(--radius-md); margin-bottom: 4px; transition: var(--transition); font-weight: 600; }
        .nav-item:hover { background: var(--color-primary-dark); transform: translateX(4px); }
        .nav-item.active { background: var(--color-accent); font-weight: 700; }
        .content-area { flex: 1; margin-left: 18%; padding: 24px 32px; max-width: 1600px; width: 100%; overflow-x: hidden; }

        .card {
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--color-border);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .card h2 {
            color: var(--color-primary-dark);
            font-weight: 700;
            font-size: 1.6em;
            margin: 0 0 24px 0;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--color-border);
            text-align: center;
        }

        .stats-mini {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-mini-card {
            background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-bg-alt) 100%);
            border-radius: var(--radius-md);
            padding: 10px 6px;
            border: 1px solid var(--color-border);
            text-align: center;
        }
        .stat-mini-icon { font-size: 1.2em; margin-bottom: 4px; }
        .stat-mini-value { font-size: 1.1em; font-weight: 700; }
        .stat-mini-label { font-size: 0.65em; }

        .habit-actions-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            background: linear-gradient(135deg, var(--color-primary), var(--color-nav));
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        .habit-table-container {
            overflow-x: auto;
            width: 100%;
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-lg);
            background: white;
        }
        .habit-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        .habit-table th, .habit-table td {
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--color-border-light);
        }
        .habit-table th { background: var(--color-primary); color: white; font-weight: 600; }
        .habit-table td { background: var(--color-bg-alt); }
        .habit-table tr:hover td { background: var(--color-primary-light); }
        .habit-table th.today {
            background: #FFF9E6;
            color: var(--color-primary-dark);
            border: 3px solid var(--color-primary);
            box-shadow: inset 0 0 0 1px var(--color-primary);
        }
        .habit-table td.today {
            background: #FFF9E6;
            border: 2px solid var(--color-primary);
        }
        .habit-table .habit-name-cell {
            text-align: left;
            font-weight: 600;
            position: sticky;
            left: 0;
            background: var(--color-bg-alt);
            z-index: 10;
            border-right: 2px solid var(--color-border);
            min-width: 150px;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .habit-table thead th:first-child {
            position: sticky;
            left: 0;
            background: var(--color-primary);
            z-index: 20;
        }
        .habit-check { width: 20px; height: 20px; accent-color: var(--color-secondary); cursor: pointer; }
        .empty-state {
            color: var(--color-text-light);
            background: var(--color-primary-light);
            border: 2px dashed var(--color-border);
            padding: 30px;
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(62, 92, 102, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px;
            width: 100%;
            max-width: 800px;
            border: 2px solid var(--color-border);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 12px;
        }
        .modal-header h3 { color: var(--color-primary); }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.6em;
            cursor: pointer;
            color: var(--color-primary);
        }
        .stats-date-range {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .stats-date-range input { padding: 8px; border: 2px solid var(--color-border); border-radius: var(--radius-md); }
        .stats-date-range button { padding: 8px 16px; background: var(--color-primary); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; }
        .stats-summary {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .summary-card {
            background: var(--color-bg);
            border-radius: var(--radius-md);
            padding: 12px 20px;
            flex: 1;
            text-align: center;
            border: 1px solid var(--color-border);
        }
        .summary-value { font-size: 1.8em; font-weight: 700; color: var(--color-primary); }
        .summary-label { font-size: 0.75em; color: var(--color-text-light); }
        .chart-container {
            margin-top: 20px;
            overflow-x: auto;
        }
        canvas#statsChart {
            background: white;
            border-radius: var(--radius-lg);
            padding: 10px;
            min-width: 600px;
            width: 100%;
            height: auto;
            max-height: 300px;
        }

        .date-range-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border-light);
            align-items: center;
            flex-wrap: wrap;
        }
        .date-range-group label { font-weight: 600; font-size: 0.85em; white-space: nowrap; }
        .date-range-group input[type="date"] {
            padding: 6px 8px;
            background: white;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 0.8em;
        }
        .date-range-group button {
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-nav));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .habit-input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .habit-input-group input {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
        }
        .habit-input-group select {
            padding: 10px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
        }
        .add-btn {
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 0 16px;
            cursor: pointer;
        }
        .custom-days-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .day-btn {
            padding: 6px 12px;
            background: var(--color-bg);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .day-btn.active {
            background: var(--color-primary);
            color: white;
        }
        .habit-list-edit {
            max-height: 250px;
            overflow-y: auto;
        }
        .habit-edit-item {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: var(--color-bg);
            margin-bottom: 8px;
            border-radius: var(--radius-md);
        }
        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-nav));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        @media (max-width: 1024px) {
            .app-layout { flex-direction: column; }
            .nav-frame { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; padding: 12px 16px; border-right: none; border-bottom: 2px solid var(--color-primary); }
            .nav-section { flex-direction: row; gap: 8px; }
            .nav-title { display: none; }
            .nav-item { padding: 8px 12px; font-size: 0.85em; }
            .content-area { margin-left: 0; padding: 20px; }
        }
        @media (max-width: 768px) {
            .burger-btn { display: flex; }
            .nav-frame { 
                transform: translateX(-100%); 
                width: 80%; 
                max-width: 280px; 
                position: fixed; 
                top: 0; 
                left: 0; 
                flex-direction: column; 
                border-bottom: none; 
                border-right: 2px solid var(--color-primary-dark); 
                transition: transform 0.3s ease;
                z-index: 1002;
            }
            .nav-frame.open { transform: translateX(0); }
            .content-area { margin-left: 0; padding: 60px 16px 16px; }
            .overlay { 
                display: none; 
                position: fixed; 
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%; 
                background: rgba(0,0,0,0.4); 
                z-index: 1001; 
                transition: opacity 0.3s; 
                pointer-events: none;
            }
            .overlay.active { 
                display: block; 
                pointer-events: auto;
            }
            .stats-mini { gap: 6px; }
            .stat-mini-card { padding: 6px; }
            .stat-mini-icon { font-size: 1em; }
            .stat-mini-value { font-size: 0.9em; }
            .stat-mini-label { font-size: 0.55em; }
            .date-range-group { flex-direction: column; align-items: stretch; }
            .date-range-group button { margin-top: 8px; }
            /* Уменьшаем ширину первого столбца на мобильных */
            .habit-table .habit-name-cell {
                min-width: 90px;
                max-width: 120px;
                white-space: normal;
                word-break: break-word;
                line-height: 1.3;
                padding: 8px 6px;
            }
            .habit-table th.habit-name-cell {
                white-space: normal;
                line-height: 1.2;
                font-size: 0.8em;
            }
        }
        .overlay { display: none; pointer-events: none; }
    </style>
</head>
<body>
    <button class="burger-btn" id="burgerBtn">☰</button>
    <div class="overlay" id="overlay"></div>
    <div class="app-layout">
        <nav class="nav-frame" id="navFrame">
            <div class="logo"><h1>📅 LifeDashboard</h1><p>Полный набор для продуктивности</p></div>
            <div class="nav-section"><div class="nav-title">ГЛАВНОЕ</div><a href="index.html" class="nav-item">🏠 Главная</a><a href="day.html" class="nav-item">📆 План на день</a></div>
            <div class="nav-section"><div class="nav-title">ПЛАНИРОВАНИЕ</div><a href="week.html" class="nav-item">📋 Неделя</a><a href="month.html" class="nav-item">🗓️ Месяц</a><a href="year.html" class="nav-item">🎯 Год</a></div>
            <div class="nav-section"><div class="nav-title">ТРЕКЕРЫ</div><a href="habits.html" class="nav-item active">🔥 Привычки</a><a href="finance.html" class="nav-item">💰 Финансы</a><a href="media.html" class="nav-item">📚🎬 Книги и фильмы</a><a href="study.html" class="nav-item">📚 Учёба</a><a href="pomodoro.html" class="nav-item">🍅 Таймер помодоро</a></div>
        </nav>
        <div class="content-area">
            <div class="card">
                <h2>🔥 Трекер привычек</h2>

                <div class="stats-mini" id="statsMini"></div>

                <div class="habit-actions-bar">
                    <button class="action-btn" onclick="openHabitSettings()">⚙️ Управление привычками</button>
                    <button class="action-btn" onclick="openStatsModal()">📊 Статистика</button>
                </div>

                <div class="habit-table-container">
                    <table class="habit-table" id="habitTable">
                        <thead><tr id="tableHeader"><tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка настроек привычек (с выбором диапазона дат) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Управление привычками</h3>
                <button class="close-modal" onclick="closeHabitSettings()">✖</button>
            </div>
            
            <div class="date-range-group">
                <label>📅 Начало:</label>
                <input type="date" id="startDate">
                <label>📅 Конец:</label>
                <input type="date" id="endDate">
                <button onclick="updateDateRange()">🔄 Обновить</button>
            </div>
            
            <hr style="margin:20px 0;">
            
            <div class="form-group">
                <label>Добавить привычку</label>
                <div class="habit-input-group">
                    <input type="text" id="newHabitName" placeholder="Название">
                    <select id="newHabitFrequency">
                        <option value="daily">Ежедневно</option>
                        <option value="weekdays">По будням</option>
                        <option value="custom">Выбрать дни</option>
                    </select>
                    <button class="add-btn" onclick="addHabitFromSettings()">+</button>
                </div>
                <div class="custom-days-group" id="customDaysGroup" style="display:none;">
                    <button type="button" class="day-btn" data-day="1">Пн</button>
                    <button type="button" class="day-btn" data-day="2">Вт</button>
                    <button type="button" class="day-btn" data-day="3">Ср</button>
                    <button type="button" class="day-btn" data-day="4">Чт</button>
                    <button type="button" class="day-btn" data-day="5">Пт</button>
                    <button type="button" class="day-btn" data-day="6">Сб</button>
                    <button type="button" class="day-btn" data-day="0">Вс</button>
                </div>
            </div>
            <hr style="margin:20px 0;">
            <label style="font-weight:600;">Ваши привычки</label>
            <div class="habit-list-edit" id="settingsHabitList"></div>
            <button class="save-btn" onclick="saveHabitSettings()">💾 Сохранить</button>
        </div>
    </div>

    <!-- Модалка расширенной статистики с графиком -->
    <div id="statsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📊 Детальная статистика</h3>
                <button class="close-modal" onclick="closeStatsModal()">✖</button>
            </div>
            <div class="stats-date-range">
                <input type="date" id="statsStartDate">
                <input type="date" id="statsEndDate">
                <button onclick="updateStats()">📈 Показать</button>
            </div>
            <div class="stats-summary" id="statsSummary"></div>
            <div class="chart-container">
                <canvas id="statsChart" width="800" height="300" style="width:100%; height:auto; max-width:100%;"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ---------- Данные ----------
        let habitsData = JSON.parse(localStorage.getItem('habitsData')) || { habits: [] };
        let startDate, endDate;
        let firebaseReady = false, db = null, currentUser = null;
        let selectedDays = [];

        const firebaseConfig = {
            apiKey: "AIzaSyARKWwV3cggOhda9g6cDNcEAGOpUN4O63I",
            authDomain: "lifedashbord.firebaseapp.com",
            projectId: "lifedashbord",
            storageBucket: "lifedashbord.appspot.com",
            messagingSenderId: "206574362724",
            appId: "1:206574362724:web:83887cae4dc87b41137f71"
        };
        const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const dayNamesShort = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        document.addEventListener('DOMContentLoaded', () => {
            let savedStart = localStorage.getItem('habitStartDate');
            let savedEnd = localStorage.getItem('habitEndDate');
            if (savedStart && savedEnd) {
                startDate = new Date(savedStart);
                endDate = new Date(savedEnd);
            } else {
                let today = new Date();
                endDate = new Date(today);
                startDate = new Date(today);
                startDate.setDate(today.getDate() - 6);
            }
            document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
            document.getElementById('endDate').value = endDate.toISOString().split('T')[0];

            let freqSelect = document.getElementById('newHabitFrequency');
            freqSelect?.addEventListener('change', function() {
                let group = document.getElementById('customDaysGroup');
                group.style.display = this.value === 'custom' ? 'flex' : 'none';
            });
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    let day = parseInt(btn.dataset.day);
                    let idx = selectedDays.indexOf(day);
                    if (idx === -1) selectedDays.push(day);
                    else selectedDays.splice(idx, 1);
                    btn.classList.toggle('active');
                });
            });

            initFirebase();
            renderAll();

            const burger = document.getElementById('burgerBtn');
            const nav = document.getElementById('navFrame');
            const overlay = document.getElementById('overlay');
            
            burger.addEventListener('click', (e) => {
                e.stopPropagation();
                nav.classList.toggle('open');
                overlay.classList.toggle('active');
            });
            
            overlay.addEventListener('click', () => {
                nav.classList.remove('open');
                overlay.classList.remove('active');
            });
            
            document.querySelectorAll('.nav-item').forEach(link => {
                link.addEventListener('click', () => {
                    setTimeout(() => {
                        nav.classList.remove('open');
                        overlay.classList.remove('active');
                    }, 150);
                });
            });
            
            document.querySelector('.content-area')?.addEventListener('click', () => {
                if (nav.classList.contains('open')) {
                    nav.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });
        });

        function initFirebase() {
            let timeout = setTimeout(() => { firebaseReady = false; }, 5000);
            try {
                if (typeof firebase === 'undefined') { clearTimeout(timeout); return; }
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                firebase.auth().onAuthStateChanged(user => {
                    clearTimeout(timeout);
                    if (user) {
                        currentUser = user;
                        firebaseReady = true;
                        loadHabitsData();
                    }
                });
            } catch(e) { clearTimeout(timeout); firebaseReady = false; }
        }
        function loadHabitsData() {
            if (!currentUser || !db) return;
            db.collection('users').doc(currentUser.uid).collection('habits').doc('data').get().then(doc => {
                if (doc.exists) { habitsData = doc.data(); renderAll(); }
            });
        }
        function saveHabitsData() {
            localStorage.setItem('habitsData', JSON.stringify(habitsData));
            if (firebaseReady && currentUser && db)
                db.collection('users').doc(currentUser.uid).collection('habits').doc('data').set(habitsData);
            renderAll();
        }
        function generateId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
        function getDateKey(d) { return d.toISOString().split('T')[0]; }

        function getDatesInRange(start, end) {
            let dates = [], cur = new Date(start);
            while (cur <= end) { dates.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
            return dates;
        }

        function calculateStreak(habit) {
            let streak = 0, today = new Date();
            for (let i = 0; i < 365; i++) {
                let d = new Date(today); d.setDate(today.getDate() - i);
                let key = getDateKey(d);
                if (!habit.days.includes(d.getDay())) continue;
                if (habit.completed?.[key]) streak++;
                else if (i > 0) break;
            }
            return streak;
        }

        function renderAll() {
            renderStatsMini();
            renderHabitTable();
        }

        function renderStatsMini() {
            let grid = document.getElementById('statsMini');
            let total = habitsData.habits?.length || 0;
            let todayKey = getDateKey(new Date());
            let todayDay = new Date().getDay();
            let completed = 0, active = 0, best = 0;
            habitsData.habits?.forEach(h => {
                if (h.days.includes(todayDay)) { active++; if (h.completed?.[todayKey]) completed++; }
                let s = calculateStreak(h); if (s > best) best = s;
            });
            grid.innerHTML = `
                <div class="stat-mini-card"><div class="stat-mini-icon">🎯</div><div class="stat-mini-value">${total}</div><div class="stat-mini-label">Всего</div></div>
                <div class="stat-mini-card"><div class="stat-mini-icon">✅</div><div class="stat-mini-value">${completed}/${active}</div><div class="stat-mini-label">Сегодня</div></div>
                <div class="stat-mini-card"><div class="stat-mini-icon">🔥</div><div class="stat-mini-value">${best}</div><div class="stat-mini-label">Лучшая серия</div></div>
            `;
        }

        function renderHabitTable() {
            let header = document.getElementById('tableHeader');
            let dates = getDatesInRange(startDate, endDate);
            let todayStr = getDateKey(new Date());
            let headerHtml = '<th class="habit-name-cell">Привычка</th>';
            dates.forEach(d => {
                let dn = dayNames[d.getDay()];
                let dayNum = d.getDate();
                let mon = d.toLocaleString('ru',{month:'short'});
                let dateKey = getDateKey(d);
                let todayClass = (dateKey === todayStr) ? 'class="today"' : '';
                headerHtml += `<th ${todayClass}>${dn}<br><small>${dayNum} ${mon}</small></th>`;
            });
            header.innerHTML = headerHtml;

            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (!habitsData.habits?.length) {
                tbody.innerHTML = `<tr><td colspan="${dates.length+1}" class="empty-state">Нет привычек. Добавьте через «Управление привычками»</td></tr>`;
                return;
            }
            habitsData.habits.forEach(h => {
                let tr = document.createElement('tr');
                let row = `<td class="habit-name-cell" title="${escapeHtml(h.name)}">${escapeHtml(h.name)}</td>`;
                dates.forEach(d => {
                    let key = getDateKey(d);
                    let active = h.days.includes(d.getDay());
                    let todayClass = (key === todayStr) ? 'class="today"' : '';
                    if (active) {
                        let checked = h.completed?.[key] ? 'checked' : '';
                        row += `<td ${todayClass}><input type="checkbox" class="habit-check" ${checked} onchange="toggleHabit('${h.id}', '${key}', this.checked)"></td>`;
                    } else {
                        row += `<td ${todayClass} style="opacity:0.5;">—</td>`;
                    }
                });
                tr.innerHTML = row;
                tbody.appendChild(tr);
            });
        }

        window.toggleHabit = function(id, dateKey, val) {
            let h = habitsData.habits.find(hh => hh.id === id);
            if (!h) return;
            if (!h.completed) h.completed = {};
            h.completed[dateKey] = val;
            saveHabitsData();
            renderStatsMini();
        };
        window.updateDateRange = function() {
            let s = document.getElementById('startDate').value;
            let e = document.getElementById('endDate').value;
            if (!s || !e) return;
            startDate = new Date(s); endDate = new Date(e);
            if (startDate > endDate) return;
            localStorage.setItem('habitStartDate', s);
            localStorage.setItem('habitEndDate', e);
            renderHabitTable();
        };

        // ---------- Настройки привычек ----------
        window.openHabitSettings = function() {
            selectedDays = [];
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('newHabitName').value = '';
            document.getElementById('newHabitFrequency').value = 'daily';
            document.getElementById('customDaysGroup').style.display = 'none';
            renderSettingsList();
            document.getElementById('settingsModal').classList.add('active');
        };
        window.closeHabitSettings = () => document.getElementById('settingsModal').classList.remove('active');
        function renderSettingsList() {
            let container = document.getElementById('settingsHabitList');
            container.innerHTML = '';
            if (!habitsData.habits?.length) { container.innerHTML = '<p style="text-align:center;padding:20px;">Нет привычек</p>'; return; }
            habitsData.habits.forEach((h, idx) => {
                let div = document.createElement('div');
                div.className = 'habit-edit-item';
                div.innerHTML = `<span style="flex:1;">${escapeHtml(h.name)}</span><button onclick="deleteHabit(${idx})" style="background:var(--color-primary); border:none; border-radius:var(--radius-sm); padding:4px 12px;">✖</button>`;
                container.appendChild(div);
            });
        }
        window.deleteHabit = function(idx) { habitsData.habits.splice(idx,1); saveHabitsData(); renderSettingsList(); };
        window.addHabitFromSettings = function() {
            let name = document.getElementById('newHabitName').value.trim();
            if (!name) return;
            let freq = document.getElementById('newHabitFrequency').value;
            let days = [];
            if (freq === 'daily') days = [0,1,2,3,4,5,6];
            else if (freq === 'weekdays') days = [1,2,3,4,5];
            else days = selectedDays.length ? selectedDays : [0,1,2,3,4,5,6];
            habitsData.habits.push({ id: generateId(), name, frequency: freq, days, completed: {} });
            saveHabitsData();
            document.getElementById('newHabitName').value = '';
            selectedDays = [];
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            renderSettingsList();
        };
        window.saveHabitSettings = function() { closeHabitSettings(); };

        // ---------- Расширенная статистика с графиком ----------
        window.openStatsModal = function() {
            document.getElementById('statsStartDate').value = startDate.toISOString().split('T')[0];
            document.getElementById('statsEndDate').value = endDate.toISOString().split('T')[0];
            updateStats();
            document.getElementById('statsModal').classList.add('active');
        };
        window.closeStatsModal = () => document.getElementById('statsModal').classList.remove('active');

        window.updateStats = function() {
            let s = document.getElementById('statsStartDate').value;
            let e = document.getElementById('statsEndDate').value;
            if (!s || !e) return;
            let start = new Date(s), end = new Date(e);
            if (start > end) return;
            let dates = getDatesInRange(start, end);
            let habits = habitsData.habits || [];
            let totalChecks = 0, totalPossible = 0;
            let dailyData = [];
            dates.forEach(d => {
                let key = getDateKey(d);
                let day = d.getDay();
                let possible = 0, done = 0;
                habits.forEach(h => {
                    if (!h.days.includes(day)) return;
                    possible++;
                    if (h.completed?.[key]) done++;
                });
                totalPossible += possible;
                totalChecks += done;
                dailyData.push({ date: d, done, possible, percent: possible ? Math.round(done/possible*100) : 0 });
            });
            let percentTotal = totalPossible ? Math.round(totalChecks/totalPossible*100) : 0;
            document.getElementById('statsSummary').innerHTML = `
                <div class="summary-card"><div class="summary-value">${totalChecks}/${totalPossible}</div><div class="summary-label">Выполнено</div></div>
                <div class="summary-card"><div class="summary-value">${percentTotal}%</div><div class="summary-label">Общий процент</div></div>
            `;
            drawChart(dailyData);
        };

        function drawChart(dailyData) {
            const canvas = document.getElementById('statsChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = Math.max(800, dailyData.length * 40);
            canvas.width = width;
            canvas.height = 300;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!dailyData.length) return;
            
            const padding = { top: 20, right: 20, bottom: 40, left: 40 };
            const chartWidth = canvas.width - padding.left - padding.right;
            const chartHeight = canvas.height - padding.top - padding.bottom;
            const barWidth = Math.min(30, chartWidth / dailyData.length * 0.7);
            const barSpacing = (chartWidth - (barWidth * dailyData.length)) / (dailyData.length - 1);
            
            ctx.save();
            ctx.strokeStyle = "#ddd";
            ctx.fillStyle = "#6B7C9E";
            ctx.font = "10px Inter";
            for (let i = 0; i <= 5; i++) {
                let y = padding.top + chartHeight - (i / 5) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartWidth, y);
                ctx.stroke();
                ctx.fillText(`${i*20}%`, 5, y);
            }
            
            for (let i = 0; i < dailyData.length; i++) {
                let x = padding.left + i * (barWidth + barSpacing);
                let percent = dailyData[i].percent;
                let height = (percent / 100) * chartHeight;
                let y = padding.top + chartHeight - height;
                ctx.fillStyle = "#93ABDB";
                ctx.fillRect(x, y, barWidth, height);
                ctx.strokeStyle = "#768FC2";
                ctx.strokeRect(x, y, barWidth, height);
                let d = dailyData[i].date;
                let label = `${d.getDate()}/${d.getMonth()+1}`;
                ctx.fillStyle = "#3D4A66";
                ctx.font = "8px Inter";
                ctx.save();
                ctx.translate(x + barWidth/2, padding.top + chartHeight + 12);
                ctx.rotate(-0.5);
                ctx.fillText(label, 0, 0);
                ctx.restore();
                if (percent > 0) {
                    ctx.fillStyle = "#5B6F9E";
                    ctx.font = "bold 9px Inter";
                    ctx.fillText(percent + "%", x + barWidth/2 - 8, y - 5);
                }
            }
            ctx.restore();
        }
    </script>
</body>
